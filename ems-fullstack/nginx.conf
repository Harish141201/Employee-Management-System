server {
    listen 80;
    server_name localhost;

    # Reverse-proxy API calls to the backend container. This means the
    # browser only ever talks to this one origin (nginx), so CORS never
    # comes into play in the containerized deployment — the browser sees
    # everything as same-origin, and nginx forwards server-to-server.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same idea for Swagger UI / OpenAPI docs, reachable at /swagger-ui.html
    # through the same origin as the app itself.
    location /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
    }
    location /swagger-ui.html {
        proxy_pass http://backend:8080/swagger-ui.html;
    }
    location /v3/api-docs/ {
        proxy_pass http://backend:8080/v3/api-docs/;
    }

    # React Router uses client-side routing — any path that isn't a real
    # static file falls back to index.html so refreshing on e.g.
    # /add-employee doesn't 404.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
