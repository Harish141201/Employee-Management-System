# Test-only config: in-memory H2 instead of the real MySQL instance, so
# tests run standalone without any local database setup.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

app.jwt.secret=test-only-secret-key-not-used-anywhere-real-do-not-reuse-this
app.seed.admin-password=
