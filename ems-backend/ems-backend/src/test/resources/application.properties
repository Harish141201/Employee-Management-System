# Test-only config: in-memory H2 instead of the real MySQL instance, so
# tests run standalone without any local database setup.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway runs before Hibernate creates tables, but this test DB is rebuilt
# from entities fresh every run (create-drop above) — Flyway's V1 migration
# would try to index tables that don't exist yet at that point. Disabling
# it here is standard practice for an ephemeral test schema; it's not
# needed anyway since create-drop already faithfully rebuilds the schema
# from the entities on every test run.
spring.flyway.enabled=false

app.jwt.secret=test-only-secret-key-not-used-anywhere-real-do-not-reuse-this
app.seed.admin-password=
