spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Flyway layers explicit, versioned migrations on top of Hibernate's
# auto-DDL rather than replacing it (ddl-auto stays "update" above).
# Deliberate, not a half-measure: a full cutover to ddl-auto=validate
# would need a hand-written migration that recreates the ENTIRE existing
# schema byte-for-byte, and that isn't something I can verify against a
# real database in this environment — getting it subtly wrong would break
# app startup, a worse outcome than the current setup. This still gets
# genuine versioned-migration infrastructure and history tracking for new,
# explicit changes (like the indexes below) without that risk.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

server.port=${SERVER_PORT:8080}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://employee-management-system-1-0ivg.onrender.com}

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

app.seed.admin-username=${ADMIN_SEED_USERNAME:admin}
app.seed.admin-password=${ADMIN_SEED_PASSWORD:}
app.seed.demo-data=${DEMO_DATA:true}

# Document files live outside the database; configure this to persistent object/file storage in production.
app.documents.storage-path=${DOCUMENT_STORAGE_PATH:./uploads/peoplehub-documents}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
